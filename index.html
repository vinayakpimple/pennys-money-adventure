<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5aa8d6">
  <meta name="description" content="Penny's Money Adventure — a picture-book money game for kids ages 7–12. No ads, no accounts, no real money.">
  <title>Penny’s Money Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#app">Skip to adventure</a>

  <header class="topbar" role="banner">
    <a class="brand" href="#/" aria-label="Penny’s Money Adventure home">
      <span class="brand-penny" id="headerPenny" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-kicker">A picture-book money game</span>
        <span class="brand-title">Penny’s Money Adventure</span>
      </span>
    </a>

    <div class="topbar-tools">
      <div class="wallet-chip" id="walletChip" aria-live="polite">
        <span class="wallet-coin" aria-hidden="true"></span>
        <span class="wallet-count" id="coinCount">0</span>
        <span class="sr-only">Penny coins in wallet</span>
      </div>

      <div class="progress-jar" title="Badges collected" aria-label="Lesson badges">
        <div class="jar-glass">
          <div class="jar-fill" id="jarFill"></div>
        </div>
        <span class="jar-label" id="jarLabel">0 / 9</span>
      </div>

      <nav class="top-nav" aria-label="More">
        <a class="nav-link" href="#/glossary">Words</a>
        <a class="nav-link" href="#/parents">Grown-ups</a>
        <button class="icon-btn" id="soundToggle" type="button" aria-pressed="true" aria-label="Sound on">
          <span id="soundIcon" aria-hidden="true">🔊</span>
        </button>
        <button class="icon-btn" id="fontToggle" type="button" aria-pressed="false" aria-label="Easy-read text">
          <span aria-hidden="true">Aa</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1">
    <section class="town-world" aria-label="Penny Town winding path">
      <svg class="town-skyline" viewBox="0 0 1200 800" role="img" aria-label="Illustrated town with a winding adventure path">
        <defs>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7ec4ea"/>
            <stop offset="55%" stop-color="#c9e7f7"/>
            <stop offset="100%" stop-color="#ffe7b8"/>
          </linearGradient>
        </defs>
        <rect width="1200" height="800" fill="url(#skyG)"/>
        <path class="winding-path" d="M80 720 C180 680 220 620 160 540 C100 460 280 420 360 480 C440 540 560 500 620 400 C680 300 800 360 880 280 C960 200 860 140 780 120" fill="none" stroke="#e8c48a" stroke-width="42" stroke-linecap="round"/>
      </svg>
      <p class="town-fallback-note">Follow the glowing path. Nine landmarks, four town buildings, and Penny waiting at the start.</p>
    </section>
  </main>

  <footer class="site-foot">
    <p>Made for curious kids. No ads, no sign-ups, no real money — just learning.</p>
  </footer>

  <div id="coin-layer" class="fx-layer" aria-hidden="true"></div>
  <div id="confetti-layer" class="fx-layer" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
